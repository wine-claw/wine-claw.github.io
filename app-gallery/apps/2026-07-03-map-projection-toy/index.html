<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="robots" content="noindex, nofollow">
  <title>Map Projection Toy</title>
  <style>
    :root{
      --bg:#0d1117; --panel:#161b22; --text:#c9d1d9; --muted:#8b949e;
      --accent:#58a6ff; --accent2:#f0883e; --ok:#3fb950; --warn:#d29922; --bad:#f85149;
      --ring:rgba(88,166,255,0.25);
    }
    *{box-sizing:border-box;}
    html,body{height:100%; margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:manipulation;}
    .warning{position:fixed; top:0; left:0; right:0; z-index:20; background:#f0883e; color:#0d1117; font-size:12px; padding:6px 12px; text-align:center; font-weight:600;}
    .wrap{position:fixed; top:32px; left:0; right:0; bottom:0; display:flex; flex-direction:column;}
    header{flex:0 0 auto; padding:12px 14px 8px; display:flex; align-items:center; justify-content:space-between; gap:10px;}
    h1{margin:0; font-size:18px; letter-spacing:-0.3px;}
    .subtitle{font-size:12px; color:var(--muted); margin-top:2px;}
    .controls{flex:0 0 auto; padding:0 14px 10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center;}
    select, button, input[type=range]{font:inherit; color:var(--text); background:var(--panel); border:1px solid #30363d; border-radius:6px; padding:6px 10px; outline:none;}
    select{font-size:13px; min-width:130px;}
    button{cursor:pointer; font-weight:600; font-size:13px;}
    button:hover{border-color:var(--accent);}
    button.primary{background:var(--accent); color:#0d1117; border-color:var(--accent);}
    .group{display:flex; align-items:center; gap:6px; flex-wrap:wrap;}
    label{font-size:12px; color:var(--muted);}
    input[type=range]{width:90px; padding:0; height:24px; background:transparent; border:none;}
    .stage{flex:1 1 auto; position:relative; min-height:0; display:flex; align-items:center; justify-content:center; padding:0 14px 14px;}
    canvas{background:radial-gradient(circle at 50% 50%, #0f1724 0%, #05070a 100%); border:1px solid #30363d; border-radius:12px; box-shadow:0 8px 32px rgba(0,0,0,0.4); max-width:100%; max-height:100%;}
    .overlay{position:absolute; left:18px; bottom:18px; background:rgba(13,17,23,0.85); border:1px solid #30363d; border-radius:8px; padding:8px 12px; font-size:12px; color:var(--muted); pointer-events:none;}
    .overlay b{color:var(--text);}
    .legend{position:absolute; right:18px; top:18px; background:rgba(13,17,23,0.85); border:1px solid #30363d; border-radius:8px; padding:8px 10px; font-size:11px; color:var(--muted);}
    .legend span{display:inline-flex; align-items:center; gap:4px; margin-right:8px;}
    .dot{width:8px; height:8px; border-radius:50%; display:inline-block;}
    @media (max-width:500px){
      h1{font-size:15px;}
      .subtitle{display:none;}
      select, button{font-size:12px; padding:5px 8px;}
      .controls{padding:0 10px 8px; flex-direction:column; align-items:stretch;}
      .group{justify-content:space-between; width:100%;}
      input[type=range]{flex:1; max-width:120px;}
      .overlay,.legend{font-size:10px; padding:6px 8px;}
    }
  </style>
</head>
<body>
  <div class="warning">Experimental OpenClaw AI mini-app — untested, not professionally validated. Do not rely on it for decisions.</div>
  <div class="wrap">
    <header>
      <div>
        <h1>Map Projection Toy</h1>
        <div class="subtitle">Spin the globe. Switch projections. Watch distortion grow.</div>
      </div>
    </header>
    <div class="controls">
      <select id="projectionSelect" aria-label="Projection">
        <option value="orthographic" selected>Orthographic (globe)</option>
        <option value="mercator">Mercator</option>
        <option value="equalEarth">Equal Earth</option>
        <option value="mollweide">Mollweide</option>
        <option value="equirectangular">Equirectangular</option>
        <option value="stereographic">Stereographic</option>
        <option value="azimuthalEqualArea">Azimuthal Equal-Area</option>
        <option value="winkelTripel">Winkel Tripel</option>
      </select>
      <button id="btnSpin" class="primary">Spin</button>
      <button id="btnStop">Stop</button>
      <button id="btnReset">Reset</button>
      <div class="group">
        <label for="gridDensity">grid</label>
        <input id="gridDensity" type="range" min="0" max="30" value="12">
      </div>
      <div class="group">
        <label for="rotateLambda">lon</label>
        <input id="rotateLambda" type="range" min="-180" max="180" value="20">
      </div>
      <div class="group">
        <label for="rotatePhi">lat</label>
        <input id="rotatePhi" type="range" min="-90" max="90" value="10">
      </div>
      <button id="btnTissot">Toggle Tissot</button>
    </div>
    <div class="stage" id="stage">
      <canvas id="map" aria-label="Map projection canvas"></canvas>
      <div class="overlay" id="overlay">
        <b id="projName">Orthographic</b><br>
        <span id="projDesc">A perspective view from infinite distance.</span>
      </div>
      <div class="legend" id="legend">
        <span><i class="dot" style="background:var(--accent2)"></i> land</span>
        <span><i class="dot" style="background:var(--ring)"></i> grid</span>
        <span><i class="dot" style="background:var(--ok)"></i> Tissot</span>
      </div>
    </div>
  </div>
  <script>
    'use strict';
    const canvas = document.getElementById('map');
    const ctx = canvas.getContext('2d');
    const stage = document.getElementById('stage');
    const DPR = Math.max(1, Math.min(3, window.devicePixelRatio || 1));
    let width, height, cx, cy, scale;

    const rotateLambda = document.getElementById('rotateLambda');
    const rotatePhi = document.getElementById('rotatePhi');
    const projectionSelect = document.getElementById('projectionSelect');
    const gridDensity = document.getElementById('gridDensity');
    const btnSpin = document.getElementById('btnSpin');
    const btnStop = document.getElementById('btnStop');
    const btnReset = document.getElementById('btnReset');
    const btnTissot = document.getElementById('btnTissot');
    const projName = document.getElementById('projName');
    const projDesc = document.getElementById('projDesc');

    const state = {
      projection: 'orthographic',
      lambda: 20,
      phi: 10,
      gamma: 0,
      grid: 12,
      showTissot: true,
      spinning: true,
      land: null,
      graticule: null,
      tissot: null,
    };

    const projectionInfo = {
      orthographic: {name:'Orthographic', desc:'A perspective view from very far away. Shows half the Earth.'},
      mercator: {name:'Mercator', desc:'Preserves angles. Areas near poles are hugely stretched.'},
      equalEarth: {name:'Equal Earth', desc:'Equal-area pseudocylindrical. Sizes stay true, shapes bend.'},
      mollweide: {name:'Mollweide', desc:'Equal-area oval. Great for global comparisons of area.'},
      equirectangular: {name:'Equirectangular', desc:'Simple lat/lon grid. Stretchy at high latitudes.'},
      stereographic: {name:'Stereographic', desc:'Conformal azimuthal. Circles stay circles, area explodes outward.'},
      azimuthalEqualArea: {name:'Azimuthal Equal-Area', desc:'Lambert azimuthal equal-area. True area from the centre.'},
      winkelTripel: {name:'Winkel Tripel', desc:'Compromise projection. National Geographic favourite.'},
    };

    function toRad(d){return d*Math.PI/180;}
    function toDeg(r){return r*180/Math.PI;}
    function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
    function mod360(v){let r=v%360; return r<0?r+360:r;}

    // Great-circle interpolation between two lon/lat points
    function slerp(a,b,t){
      const al=toRad(a[0]), af=toRad(a[1]), bl=toRad(b[0]), bf=toRad(b[1]);
      const d = 2*Math.asin(Math.sqrt(Math.pow(Math.sin((af-bf)/2),2)+Math.cos(af)*Math.cos(bf)*Math.pow(Math.sin((al-bl)/2),2)));
      if(d<1e-12) return a.slice();
      const A = Math.sin((1-t)*d)/Math.sin(d);
      const B = Math.sin(t*d)/Math.sin(d);
      const x = A*Math.cos(af)*Math.cos(al) + B*Math.cos(bf)*Math.cos(bl);
      const y = A*Math.cos(af)*Math.sin(al) + B*Math.cos(bf)*Math.sin(bl);
      const z = A*Math.sin(af) + B*Math.sin(bf);
      return [toDeg(Math.atan2(y,x)), toDeg(Math.atan2(z,Math.sqrt(x*x+y*y)))];
    }

    // Project a [lon, lat] point using the current projection.
    function project(lon, lat, projection, lambda, phi, gamma){
      const lam = toRad(lon + lambda);
      const ph = toRad(lat);
      const sinP = Math.sin(ph), cosP = Math.cos(ph);
      const sinL = Math.sin(lam), cosL = Math.cos(lam);
      // Rotate so the center point (lambda, phi) comes to the front (+z).
      // First rotate around z by -lambda, then around y by -phi, then around z by -gamma.
      const sinLam = Math.sin(-toRad(lambda)), cosLam = Math.cos(-toRad(lambda));
      const sinPhi = Math.sin(-toRad(phi)), cosPhi = Math.cos(-toRad(phi));
      const sinGam = Math.sin(-toRad(gamma)), cosGam = Math.cos(-toRad(gamma));
      let x = cosP * cosL;
      let y = cosP * sinL;
      let z = sinP;
      // rotate around z by -lambda
      let x1 = x*cosLam - y*sinLam;
      let y1 = x*sinLam + y*cosLam;
      x = x1; y = y1;
      // rotate around y by -phi
      x1 = x*cosPhi - z*sinPhi;
      let z1 = x*sinPhi + z*cosPhi;
      x = x1; z = z1;
      // rotate around z by -gamma
      x1 = x*cosGam - y*sinGam;
      y1 = x*sinGam + y*cosGam;
      x = x1; y = y1;

      switch(projection){
        case 'orthographic':{
          if(z <= 0) return null;
          return [x, -y];
        }
        case 'stereographic':{
          if(z <= -0.999) return null;
          const k = 1 / (1 + z);
          return [x*k, -y*k];
        }
        case 'azimuthalEqualArea':{
          if(z <= -0.999) return null;
          const k = Math.sqrt(2/(1+z));
          return [x*k, -y*k];
        }
        case 'mercator':{
          if(Math.abs(ph) > Math.PI/2 - 1e-6) return null;
          // Return normalized Mercator in radians so scale works in screen px per radian.
          const xx = lam;
          const yy = Math.log(Math.tan(Math.PI/4 + ph/2));
          return [xx, -yy];
        }
        case 'equirectangular':{
          return [toDeg(lam), -toDeg(ph)];
        }
        case 'equalEarth':{
          const clippedPh = clamp(ph, -Math.PI/2+1e-6, Math.PI/2-1e-6);
          const v = Math.sqrt(3)/2 * Math.sin(clippedPh);
          const theta = Math.asin(v);
          const theta2 = theta*theta, theta3 = theta2*theta, theta5 = theta3*theta2, theta6 = theta5*theta;
          const A = 1.340264, B = -0.081106, C = 0.000893, D = 0.003796;
          const y1 = A*theta + B*theta3 + C*theta6 + D*theta5*theta;
          const phi1 = 1 + Math.sqrt(3)/2;
          const x1 = (2*Math.sqrt(3)*lam*Math.cos(theta)) / (3*phi1);
          return [toDeg(x1), -toDeg(y1)];
        }
        case 'mollweide':{
          const clippedPh = clamp(ph, -Math.PI/2+1e-6, Math.PI/2-1e-6);
          const theta = 2*Math.asin(2*Math.sin(clippedPh)/Math.PI);
          if(isNaN(theta)) return null;
          const xx = 2*Math.sqrt(2)/Math.PI * lam * Math.cos(theta);
          const yy = Math.sqrt(2)*Math.sin(theta);
          return [toDeg(xx), -toDeg(yy)];
        }
        case 'winkelTripel':{
          const alpha = Math.acos(Math.cos(ph)*Math.cos(lam/2));
          const sinc = alpha === 0 ? 1 : Math.sin(alpha)/alpha;
          const xeq = lam*Math.cos(toRad(50));
          const yeq = ph;
          const xm = 2*Math.sqrt(2)/Math.PI * lam * Math.cos(ph);
          const ym = Math.sqrt(2)*Math.sin(ph);
          const xw = (xeq + xm)/2;
          const yw = (yeq + ym)/2;
          return [toDeg(xw), -toDeg(yw)];
        }
      }
      return null;
    }

    // Compute a sensible scale based on current projection.
    function computeScale(proj){
      const s = Math.min(width, height);
      switch(proj){
        case 'orthographic': return s*0.42;
        case 'mercator': return s*0.25;
        case 'equirectangular': return s*0.006;
        case 'equalEarth': return s*0.010;
        case 'mollweide': return s*0.012;
        case 'winkelTripel': return s*0.010;
        case 'stereographic': return s*0.32;
        case 'azimuthalEqualArea': return s*0.32;
      }
      return s*0.2;
    }

    function resize(){
      const rect = stage.getBoundingClientRect();
      const size = Math.min(Math.floor(rect.width), Math.floor(rect.height));
      width = size; height = size;
      canvas.width = Math.floor(width * DPR); canvas.height = Math.floor(height * DPR);
      canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
      cx = canvas.width/2; cy = canvas.height/2;
      ctx.setTransform(DPR,0,0,DPR,0,0);
      scale = computeScale(state.projection);
      draw();
    }

    function fetchWorld(){
      return fetch('world-land.geojson')
        .then(r=>r.json())
        .then(fc=>{
          state.land = fc.features[0].geometry;
        })
        .catch(e=>{
          console.error(e);
          state.land = {type:'MultiPolygon', coordinates:[]};
        });
    }

    function buildGraticule(density){
      if(!density) return [];
      const lines = [];
      const step = density > 0 ? 180/density : 30;
      for(let lon=-180; lon<=180; lon+=step){
        const pts=[];
        for(let lat=-90; lat<=90; lat+=5) pts.push([lon,lat]);
        lines.push(pts);
      }
      for(let lat=-90; lat<=90; lat+=step){
        const pts=[];
        for(let lon=-180; lon<=180; lon+=5) pts.push([lon,lat]);
        lines.push(pts);
      }
      return lines;
    }

    function buildTissot(step=30){
      const circles=[];
      for(let lat=-75; lat<=75; lat+=step){
        for(let lon=-180; lon<180; lon+=step){
          const pts=[];
          const r = 5; // radius in degrees
          for(let a=0; a<=360; a+=10){
            const rad=toRad(a);
            // small circle on sphere
            const d = toRad(r);
            const phi0=toRad(lat), lambda0=toRad(lon);
            const ph = Math.asin(Math.sin(phi0)*Math.cos(d)+Math.cos(phi0)*Math.sin(d)*Math.cos(rad));
            const dl = Math.atan2(Math.sin(rad)*Math.sin(d)*Math.cos(phi0), Math.cos(d)-Math.sin(phi0)*Math.sin(ph));
            const lam = lambda0 + dl;
            pts.push([toDeg(lam), toDeg(ph)]);
          }
          circles.push(pts);
        }
      }
      return circles;
    }

    // For azimuthal projections, if a segment crosses the visible horizon, insert an approximate rim point.
    function path(coords, close=false){
      let first=true;
      for(const ring of coords){
        let moved=false, last=null;
        for(const pt of ring){
          const p = project(pt[0], pt[1], state.projection, state.lambda, state.phi, state.gamma);
          if(p === null){ moved=false; last=null; continue; }
          const sx = cx + p[0]*scale;
          const sy = cy + p[1]*scale;
          if(!moved){ ctx.moveTo(sx,sy); moved=true; }
          else ctx.lineTo(sx,sy);
          last=[sx,sy];
        }
        if(moved && close) ctx.closePath();
        first=false;
      }
    }

    function draw(){
      ctx.clearRect(0,0,width,height);
      // background halo
      const grad = ctx.createRadialGradient(cx, cy, scale*0.1, cx, cy, scale*0.9);
      grad.addColorStop(0, 'rgba(15,30,50,0.6)');
      grad.addColorStop(1, 'rgba(5,7,10,0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0,0,width,height);

      // sphere outline for azimuthals
      if(['orthographic','stereographic','azimuthalEqualArea'].includes(state.projection)){
        ctx.beginPath();
        ctx.arc(cx, cy, scale, 0, Math.PI*2);
        ctx.strokeStyle = 'rgba(88,166,255,0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, scale, 0, Math.PI*2);
        ctx.clip();
      }

      // graticule
      if(state.grid){
        const grid = state.graticule || (state.graticule = buildGraticule(state.grid));
        ctx.beginPath();
        for(const line of grid){
          let moved=false;
          for(const pt of line){
            const p = project(pt[0], pt[1], state.projection, state.lambda, state.phi, state.gamma);
            if(p === null){ moved=false; continue; }
            const sx = cx + p[0]*scale;
            const sy = cy + p[1]*scale;
            if(!moved){ ctx.moveTo(sx,sy); moved=true; }
            else ctx.lineTo(sx,sy);
          }
        }
        ctx.strokeStyle = 'rgba(88,166,255,0.18)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      // land
      if(state.land){
        ctx.beginPath();
        if(state.land.type === 'MultiPolygon'){
          for(const mp of state.land.coordinates){
            for(const poly of mp) path(poly, true);
          }
        } else if(state.land.type === 'Polygon'){
          for(const poly of state.land.coordinates) path(poly, true);
        }
        ctx.fillStyle = 'rgba(240,136,62,0.85)';
        ctx.fill();
        ctx.lineWidth = 1;
        ctx.strokeStyle = 'rgba(240,136,62,0.9)';
        ctx.stroke();
      }

      if(['orthographic','stereographic','azimuthalEqualArea'].includes(state.projection)){
        ctx.restore();
      }

      // tissot
      if(state.showTissot){
        const tissot = state.tissot || (state.tissot = buildTissot());
        for(const circ of tissot){
          ctx.beginPath();
          let moved=false;
          for(const pt of circ){
            const p = project(pt[0], pt[1], state.projection, state.lambda, state.phi, state.gamma);
            if(p === null){ moved=false; continue; }
            const sx = cx + p[0]*scale;
            const sy = cy + p[1]*scale;
            if(!moved){ ctx.moveTo(sx,sy); moved=true; }
            else ctx.lineTo(sx,sy);
          }
          if(moved) ctx.closePath();
          ctx.fillStyle = 'rgba(63,185,80,0.10)';
          ctx.fill();
          ctx.strokeStyle = 'rgba(63,185,80,0.35)';
          ctx.lineWidth = 0.8;
          ctx.stroke();
        }
      }

      // center marker
      ctx.beginPath();
      ctx.arc(cx, cy, 3, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(139,148,158,0.5)';
      ctx.fill();
    }

    function updateInfo(){
      const info = projectionInfo[state.projection];
      projName.textContent = info.name;
      projDesc.textContent = info.desc;
    }

    let raf;
    function loop(){
      if(state.spinning){
        state.lambda += 0.25;
        if(state.lambda > 180) state.lambda -= 360;
        rotateLambda.value = Math.round(state.lambda);
      }
      draw();
      raf = requestAnimationFrame(loop);
    }

    function syncFromUI(){
      state.projection = projectionSelect.value;
      state.grid = parseInt(gridDensity.value,10);
      state.lambda = parseFloat(rotateLambda.value);
      state.phi = parseFloat(rotatePhi.value);
      state.graticule = null; // rebuild
      scale = computeScale(state.projection);
      updateInfo();
      draw();
    }

    projectionSelect.addEventListener('change', syncFromUI);
    gridDensity.addEventListener('input', syncFromUI);
    rotateLambda.addEventListener('input', ()=>{ state.spinning=false; syncFromUI(); });
    rotatePhi.addEventListener('input', ()=>{ state.spinning=false; syncFromUI(); });
    btnSpin.addEventListener('click', ()=>{ state.spinning=true; });
    btnStop.addEventListener('click', ()=>{ state.spinning=false; });
    btnReset.addEventListener('click', ()=>{
      state.lambda=20; state.phi=10; state.gamma=0;
      rotateLambda.value=20; rotatePhi.value=10;
      state.spinning=true;
      syncFromUI();
    });
    btnTissot.addEventListener('click', ()=>{ state.showTissot=!state.showTissot; draw(); });

    let touchStart=null;
    canvas.addEventListener('touchstart', e=>{
      if(e.touches.length===1) touchStart=[e.touches[0].clientX, e.touches[0].clientY, state.lambda, state.phi];
    }, {passive:false});
    canvas.addEventListener('touchmove', e=>{
      if(touchStart && e.touches.length===1){
        e.preventDefault();
        const dx=e.touches[0].clientX-touchStart[0];
        const dy=e.touches[0].clientY-touchStart[1];
        state.lambda = touchStart[2] + dx*0.4;
        state.phi = clamp(touchStart[3] - dy*0.3, -90, 90);
        rotateLambda.value=Math.round(state.lambda);
        rotatePhi.value=Math.round(state.phi);
        state.spinning=false;
        state.graticule=null;
        draw();
      }
    }, {passive:false});
    canvas.addEventListener('touchend', ()=>touchStart=null);

    let mouseStart=null;
    canvas.addEventListener('mousedown', e=>{ mouseStart=[e.clientX, e.clientY, state.lambda, state.phi]; });
    window.addEventListener('mousemove', e=>{
      if(!mouseStart) return;
      const dx=e.clientX-mouseStart[0];
      const dy=e.clientY-mouseStart[1];
      state.lambda = mouseStart[2] + dx*0.4;
      state.phi = clamp(mouseStart[3] - dy*0.3, -90, 90);
      rotateLambda.value=Math.round(state.lambda);
      rotatePhi.value=Math.round(state.phi);
      state.spinning=false;
      state.graticule=null;
      draw();
    });
    window.addEventListener('mouseup', ()=>mouseStart=null);

    window.addEventListener('resize', ()=>{ resize(); });

    fetchWorld().then(()=>{
      resize();
      updateInfo();
      loop();
    });
  </script>
</body>
</html>

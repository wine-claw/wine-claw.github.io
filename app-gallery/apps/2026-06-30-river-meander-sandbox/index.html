<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="robots" content="noindex, nofollow" />
  <title>River Meander Sandbox</title>
  <style>
    :root {
      --bg: #0d1117;
      --panel: #161b22;
      --panel-2: #1f2630;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --accent-2: #7ee787;
      --danger: #f85149;
      --soil: #3d2b1f;
      --water: #79c0ff;
      --water-deep: #388bfd;
      --sand: #d2a679;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
    }
    .banner {
      background: #211810;
      color: #ffdfb2;
      font-size: 12px;
      padding: 8px 12px;
      text-align: center;
      line-height: 1.35;
      border-bottom: 1px solid #3d2b1f;
    }
    .app {
      display: flex;
      flex-direction: column;
      height: calc(100% - 50px);
    }
    .stage {
      flex: 1 1 auto;
      position: relative;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 40%, #141a24 0%, #0d1117 100%);
      padding: 10px;
    }
    canvas {
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      border-radius: 10px;
      background: var(--soil);
      box-shadow: 0 10px 40px rgba(0,0,0,0.45);
      touch-action: none;
    }
    .controls {
      flex: 0 0 auto;
      background: var(--panel);
      border-top: 1px solid #30363d;
      padding: 12px 14px 18px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px 16px;
      max-height: 42vh;
      overflow-y: auto;
    }
    .group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-size: 12px;
      color: var(--muted);
      display: flex;
      justify-content: space-between;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .buttons {
      grid-column: 1 / -1;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }
    .left, .right { display: flex; gap: 8px; flex-wrap: wrap; }
    button {
      background: var(--panel-2);
      border: 1px solid #30363d;
      color: var(--text);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 13px;
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    button:hover { background: #2a3340; border-color: var(--accent); }
    button.primary { background: var(--accent); color: #051d3d; border-color: var(--accent); font-weight: 600; }
    button.primary:hover { filter: brightness(1.08); }
    .stats {
      font-size: 12px;
      color: var(--muted);
      white-space: nowrap;
    }
    .hint {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }
    @media (max-width: 480px) {
      .controls { grid-template-columns: 1fr 1fr; padding: 10px; gap: 10px; }
      .buttons { flex-direction: column; align-items: stretch; }
      .left, .right { justify-content: stretch; }
      button { flex: 1 1 auto; }
      .stats { text-align: center; }
    }
  </style>
</head>
<body>
  <div class="banner">
    ⚠️ Experimental OpenClaw AI mini-app — untested, not professionally validated. Do not rely on it for decisions.
  </div>
  <div class="app">
    <div class="stage"><canvas id="river"></canvas></div>
    <div class="controls">
      <div class="group">
        <label>Flow Speed <span id="speedVal">1.0</span></label>
        <input id="speed" type="range" min="0" max="3" step="0.1" value="1.0" />
      </div>
      <div class="group">
        <label>Erosion <span id="erosionVal">0.6</span></label>
        <input id="erosion" type="range" min="0" max="2" step="0.1" value="0.6" />
      </div>
      <div class="group">
        <label>Meander Seed <span id="seedVal">0.35</span></label>
        <input id="seed" type="range" min="0" max="1" step="0.05" value="0.35" />
      </div>
      <div class="group">
        <label>Bank Resistance <span id="resistVal">0.85</span></label>
        <input id="resist" type="range" min="0.2" max="1.4" step="0.05" value="0.85" />
      </div>
      <div class="buttons">
        <div class="left">
          <button id="resetBtn" class="primary">New River</button>
          <button id="pauseBtn">Pause</button>
          <button id="cutoffBtn">Force Cutoff</button>
        </div>
        <div class="right">
          <span class="stats">Sinuosity: <strong id="sinuosity">1.00</strong> | Oxbows: <strong id="oxbows">0</strong></span>
        </div>
      </div>
      <div class="hint">
        Tap/click on the map to plant a meander seed. Watch the outside bend erode, the inside bend deposit sand, and oxbow lakes form when loops pinch off.
      </div>
    </div>
  </div>
  <script src="river.js"></script>
</body>
</html>
